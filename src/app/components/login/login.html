<h1 class="welcome-text">Welcome to Kanban Flow!</h1>
<div class="auth-container">

  <div class="auth-card">

    <h1 class="app-title">Kanban Workflow Manager</h1>
    <p class="tagline">Organize your tasks efficiently</p>

    <h2>Login</h2>

    <input
      type="email"
      placeholder="Email Address"
      [(ngModel)]="email">

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password">

    <button (click)="login()">Login</button>

    <p class="message">{{message}}</p>

    <p class="switch">
      Don't have an account?
      <a routerLink="/signup">Sign Up</a>
    </p>

  </div>

</div>

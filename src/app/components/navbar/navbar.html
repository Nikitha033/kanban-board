<div class="navbar">

  <div class="logo">
    <h2>Kanban Manager</h2>
  </div>

 
  <div class="nav-links">
<a routerLink="/kanban">Statistics</a>
<a routerLink="/dashboard">Dashboard</a>
<a routerLink="/about">About</a>
<a routerLink="/contact">Contact</a>

</div>

  <div class="user-section">

    <div class="user-logo" (click)="toggleName()">
      {{ userInitial }}
    </div>

    <span *ngIf="showName" class="username">
      {{ userEmail }}
    </span>

    <button class="logout-btn" (click)="logout()">
      Logout
    </button>

  </div>

</div>
